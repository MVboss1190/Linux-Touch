schema_version: 1

id: virtual-phone
name: Linux-Touch Virtual Phone
status: development

architecture: aarch64

form_factor: phone

resolution:
  width: 1080
  height: 2400

orientation:
  default: portrait
  supported:
    - portrait
    - landscape

# Input hardware the device has. Whether the OS can actually use it is
# recorded under 'hardware'.
input:
  touchscreen: true

# Capability support states. Permitted values: supported, experimental,
# unsupported, not_implemented, unknown.
#
# Everything is not_implemented today: the runner boots with a serial
# console only, so no display, input or sensor path is exercised yet.
hardware:
  display: not_implemented
  touchscreen: not_implemented
  battery: not_implemented
  accelerometer: not_implemented
  rotation: not_implemented
  audio: not_implemented
  wifi: not_implemented
  bluetooth: not_implemented
  camera: not_implemented
  modem: not_implemented
  gpu: not_implemented

# How an image for this device is executed. Runner configuration, not
# hardware description.
runner:
  type: qemu

  qemu:
    machine: virt
    cpu: cortex-a72
    memory: 1024
    console: ttyAMA0

boot:
  method: qemu
